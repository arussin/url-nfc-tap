name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_code:
        description: Google Play version code (increase for every later Play upload)
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NFC_PRIMARY_LABEL: ${{ secrets.NFC_PRIMARY_LABEL }}
      NFC_PRIMARY_URL: ${{ secrets.NFC_PRIMARY_URL }}
      NFC_SECONDARY_LABEL: ${{ secrets.NFC_SECONDARY_LABEL }}
      NFC_SECONDARY_URL: ${{ secrets.NFC_SECONDARY_URL }}
      PLAY_VERSION_CODE: ${{ inputs.version_code }}
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require personalized links and Play signing key
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test -n "$NFC_PRIMARY_LABEL"
          test -n "$NFC_PRIMARY_URL"
          test -n "$NFC_SECONDARY_LABEL"
          test -n "$NFC_SECONDARY_URL"
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          test -n "$PLAY_UPLOAD_KEY_ALIAS"
          test -n "$PLAY_UPLOAD_KEYSTORE_PASSWORD"
          test -n "$PLAY_UPLOAD_KEY_PASSWORD"

      - name: Prepare Play upload key
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/url-nfc-tap-upload-key.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          keytool -list \
            -keystore "$key_path" \
            -alias "$PLAY_UPLOAD_KEY_ALIAS" \
            -storepass "$PLAY_UPLOAD_KEYSTORE_PASSWORD" > /dev/null
          echo "PLAY_UPLOAD_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Test, lint, and build
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease
          else
            ./gradlew testDebugUnitTest lintDebug assembleDebug
          fi

      - name: Verify Play bundle signature
        if: github.event_name == 'workflow_dispatch'
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload personalized APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: url-nfc-tap-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: url-nfc-tap-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
